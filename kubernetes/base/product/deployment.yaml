apiVersion: apps/v1
kind: Deployment
metadata:
  name: mango-product
  namespace: mango
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mango-product
  template:
    metadata:
      labels:
        app: mango-product
    spec:
      containers:
        - name: mango-product
          image: mangoservicesproductapi:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: mango-common-config
                
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: mango-secrets
                  key: Product__ConnectionStrings__DefaultConnection